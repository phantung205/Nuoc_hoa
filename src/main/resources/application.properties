spring.application.name=NuocHoa

# C\u1EA4U H\u00CCNH K\u1EBET N\u1ED0I DATABASE (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/nuoc_hoa?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# C\u1EA4U H\u00CCNH JPA / HIBERNATE
# 'update': T\u1EF1 \u0111\u1ED9ng t\u1EA1o b\u1EA3ng n\u1EBFu ch\u01B0a c\u00F3, c\u1EADp nh\u1EADt th\u00EAm c\u1ED9t n\u1EBFu Model c\u00F3 thay \u0111\u1ED5i, kh\u00F4ng x\u00F3a d\u1EEF li\u1EC7u c\u0169.
spring.jpa.hibernate.ddl-auto=update

# Hi\u1EC3n th\u1ECB c\u00E2u l\u1EC7nh SQL ra console \u0111\u1EC3 d\u1EC5 debug
spring.jpa.show-sql=true

# \u0110\u1ECBnh d\u1EA1ng c\u00E2u l\u1EC7nh SQL cho d\u1EC5 nh\u00ECn tr\u00EAn console
spring.jpa.properties.hibernate.format_sql=true

# T\u1EF1 \u0111\u1ED9ng chuy\u1EC3n \u0111\u1ED5i t\u00EAn bi\u1EBFn ki\u1EC3u CamelCase (v\u00ED d\u1EE5: categoryId)
# th\u00E0nh snake_case trong DB (v\u00ED d\u1EE5: category_id)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

server.servlet.session.timeout=30m

