spring.application.name=NuocHoa

# CẤU HÌNH KẾT NỐI DATABASE (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/nuoc_hoa?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# CẤU HÌNH JPA / HIBERNATE
# 'update': Tự động tạo bảng nếu chưa có, cập nhật thêm cột nếu Model có thay đổi, không xóa dữ liệu cũ.
spring.jpa.hibernate.ddl-auto=update

# Hiển thị câu lệnh SQL ra console để dễ debug
spring.jpa.show-sql=true

# Định dạng câu lệnh SQL cho dễ nhìn trên console
spring.jpa.properties.hibernate.format_sql=true

# Tự động chuyển đổi tên biến kiểu CamelCase (ví dụ: categoryId)
# thành snake_case trong DB (ví dụ: category_id)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy