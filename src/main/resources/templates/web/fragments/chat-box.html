<!-- File: web/fragments/chat-box.html -->
<div xmlns:th="http://www.thymeleaf.org" th:fragment="chat-widget">
    <!-- Nút bóng chat nổi -->
    <button id="chat-toggle-btn" onclick="toggleChat()">
        <i class="bi bi-chat-right-dots-fill"></i>
    </button>

    <!-- Khung cửa sổ chat -->
    <div id="chat-popup" class="chat-container">
        <div class="chat-header d-flex justify-content-between align-items-center">
            <span><i class="bi bi-stars me-2"></i> 2T&C AI</span>
            <div>
                <button class="close-btn me-2" onclick="clearChat()" title="Xóa đoạn chat"><i class="bi bi-trash"></i></button>
                <button class="close-btn" onclick="toggleChat()"><i class="bi bi-x-lg"></i></button>
            </div>
        </div>
        <div id="chat-logs" class="chat-logs"></div>
        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="Bạn cần tìm nước hoa gì?..." onkeypress="if(event.key==='Enter') sendMessage()" />
            <button class="send-btn" onclick="sendMessage()"><i class="bi bi-send-fill"></i></button>
        </div>
    </div>
</div>
