<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="main-header" class="main-header sticky-top">
    <!-- Main Navbar -->
    <nav class="navbar navbar-expand-xl navbar-dark bg-black py-3 border-bottom border-gold shadow-sm">
        <div class="container">
            <!-- Logo -->
            <a class="navbar-brand elegant-title gold-text fw-bold fs-3" th:href="@{/}">
                <i class="bi bi-droplet-fill me-2"></i>2T&C
            </a>

            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMain">
                <!-- Menu (Centered) -->
                <ul class="navbar-nav mx-auto mb-2 mb-xl-0 text-uppercase fw-semibold fs-7">
                    <li class="nav-item">
                        <a class="nav-link px-3" th:href="@{/}">Trang chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" th:href="@{/products}">Bộ Sưu Tập</a>
                    </li>
                    <li class="nav-item dropdown" th:if="${categories != null and !categories.empty}">
                        <a class="nav-link dropdown-toggle px-3 d-flex align-items-center gap-1" href="#" id="categoryDropdown" role="button" data-bs-toggle="dropdown">
                            Danh Mục
                        </a>
                        <ul class="dropdown-menu dropdown-menu-dark bg-black border-gold mt-2">
                            <li th:each="cat : ${categories}">
                                <a class="dropdown-item" th:href="@{/products(categoryId=${cat.id})}" th:text="${cat.name}">Tên Danh Mục</a>
                            </li>
                            <li><hr class="dropdown-divider border-secondary"></li>
                            <li><a class="dropdown-item gold-text" th:href="@{/products}"><i class="bi bi-grid-3x3-gap me-2"></i>Xem tất cả</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3 text-warning" th:href="@{/promotions}"><i class="bi bi-tag-fill me-1"></i>Ưu Đãi</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" th:href="@{/about}">Về Chúng Tôi</a>
                    </li>
                </ul>

                <!-- Right Section (Search & Auth) -->
                <div class="d-flex align-items-center gap-3">
                    <!-- Search Form -->
                    <form class="d-flex header-search m-0" th:action="@{/products}" method="get">
                        <div class="input-group input-group-sm">
                            <input type="text" name="keyword" class="form-control bg-dark text-light border-secondary" placeholder="Tìm kiếm...">
                            <button class="btn btn-gold" type="submit"><i class="bi bi-search"></i></button>
                        </div>
                    </form>

                    <div class="header-divider d-none d-xl-block"></div>

                    <!-- Cart -->
                    <a th:href="@{/cart}" class="btn btn-link text-white text-decoration-none p-0 position-relative cart-icon" title="Giỏ Hàng">
                        <i class="bi bi-cart3 fs-4"></i>
                    </a>

                    <!-- Auth Section -->
                    <div class="auth-section d-flex align-items-center">
                        <div sec:authorize="isAnonymous()" class="d-flex align-items-center flex-nowrap gap-2">
                            <a th:href="@{/auth/login}" class="text-white text-decoration-none fs-7 hover-gold text-nowrap">Đăng nhập</a>
                            <a th:href="@{/auth/register}" class="btn btn-gold btn-sm rounded-pill px-3 fs-7 fw-bold text-nowrap">Đăng ký</a>
                        </div>

                        <div sec:authorize="isAuthenticated()" class="dropdown">
                            <button class="btn btn-link text-white text-decoration-none dropdown-toggle p-0 d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown">
                                <img th:if="${globalUserProfile != null && globalUserProfile.avatarUrl != null && !globalUserProfile.avatarUrl.empty}" 
                                     th:src="${globalUserProfile.avatarUrl}" 
                                     class="header-avatar rounded-circle border border-gold shadow-sm">
                                <i th:unless="${globalUserProfile != null && globalUserProfile.avatarUrl != null && !globalUserProfile.avatarUrl.empty}" 
                                   class="bi bi-person-circle fs-4 gold-text"></i>
                                <span sec:authentication="name" class="fw-semibold text-nowrap"></span>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark bg-black border-gold mt-2 shadow">
                                <li><a class="dropdown-item" th:href="@{/profile}"><i class="bi bi-person me-2"></i>Trang Cá Nhân</a></li>
                                <li><a class="dropdown-item" th:href="@{/orders}"><i class="bi bi-bag me-2"></i>Đơn hàng</a></li>
                                <li sec:authorize="hasRole('ADMIN')"><a class="dropdown-item gold-text" th:href="@{/admin}"><i class="bi bi-speedometer2 me-2"></i>Trang Quản Trị</a></li>
                                <li><hr class="dropdown-divider border-secondary"></li>
                                <li>
                                    <form th:action="@{/auth/logout}" method="post" class="px-3 py-1 m-0">
                                        <button type="submit" class="btn btn-outline-light btn-sm w-100 rounded-pill">Đăng xuất</button>
                                    </form>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>
</header>
</body>
</html>
