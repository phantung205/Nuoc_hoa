<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<!-- Đặt tên fragment là 'main-header' -->
<header th:fragment="main-header">
    <a th:href="@{/}" class="logo">🌸 Nước Hoa Shop</a>
    <nav>
        <a th:href="@{/}">Trang chủ</a>
        <a th:href="@{/products}">Cửa hàng</a>

        <span sec:authorize="isAnonymous()">
                <a th:href="@{/auth/login}">Đăng nhập</a>
                <a th:href="@{/auth/register}">Đăng ký</a>
            </span>

        <span sec:authorize="isAuthenticated()" >
                <span >
                    Xin chào, <strong sec:authentication="name"></strong>
                    (<span sec:authentication="principal.authorities"></span>)
                </span>

                <a th:href="@{/profile}" >[Trang Cá Nhân]</a>

                <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" >[Trang Quản Trị]</a>

                <form th:action="@{/auth/logout}" method="post">
                    <button type="submit" class="btn-logout">Đăng xuất</button>
                </form>
            </span>
    </nav>
</header>
</body>
</html>
