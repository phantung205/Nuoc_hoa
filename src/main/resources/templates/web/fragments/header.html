<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="main-header" class="main-header sticky-top bg-black shadow-sm">
    <nav class="navbar navbar-expand-lg navbar-dark container py-3">
        <a class="navbar-brand elegant-title gold-text fw-bold fs-3" th:href="@{/}">
            <i class="bi bi-droplet-fill me-2"></i>2T&C
        </a>

        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain" aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0 text-uppercase fw-semibold" style="letter-spacing: 1px;">
                <li class="nav-item">
                    <a class="nav-link px-3" th:href="@{/}">Trang chủ</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-3" th:href="@{/products}">Bộ Sưu Tập</a>
                </li>

                <!-- Danh mục lấy động từ Controller -->
                <li class="nav-item dropdown" th:if="${categories != null and !categories.empty}">
                    <a class="nav-link dropdown-toggle px-3" href="#" id="categoryDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Danh Mục
                    </a>
                    <ul class="dropdown-menu dropdown-menu-dark bg-black border-gold" aria-labelledby="categoryDropdown">
                        <li th:each="cat : ${categories}">
                            <a class="dropdown-item" th:href="@{/categories/{id}(id=${cat.id})}" th:text="${cat.name}">Tên Danh Mục</a>
                        </li>
                    </ul>
                </li>

                <li class="nav-item">
                    <a class="nav-link px-3" href="#">Về Chúng Tôi</a>
                </li>
            </ul>

            <div class="d-flex align-items-center auth-section">
                <!-- Giỏ hàng chung (nếu click khi chưa đăng nhập, Spring Security sẽ tự chuyển hướng về login) -->
                <a th:href="@{/cart}" class="btn btn-link text-white text-decoration-none px-3 position-relative" title="Giỏ Hàng">
                    <i class="bi bi-cart3 fs-5"></i>
                </a>

                <div sec:authorize="isAnonymous()">
                    <a th:href="@{/auth/login}" class="btn btn-link text-white text-decoration-none px-3">Đăng nhập</a>
                    <a th:href="@{/auth/register}" class="btn btn-gold btn-sm rounded-pill px-4">Đăng ký</a>
                </div>

                <div sec:authorize="isAuthenticated()" class="dropdown ms-2">
                    <button class="btn btn-link text-white text-decoration-none dropdown-toggle" type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle me-1"></i>
                        <span sec:authentication="name"></span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark bg-black border-gold" aria-labelledby="userDropdown">
                        <li><a class="dropdown-item" th:href="@{/profile}">Trang Cá Nhân</a></li>
                        <li sec:authorize="hasRole('ADMIN')"><a class="dropdown-item gold-text" th:href="@{/admin}">Trang Quản Trị</a></li>
                        <li><hr class="dropdown-divider border-secondary"></li>
                        <li>
                            <form th:action="@{/auth/logout}" method="post" class="px-3 py-1">
                                <button type="submit" class="btn btn-outline-light btn-sm w-100 rounded-pill">Đăng xuất</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>
</header>
</body>
</html>
