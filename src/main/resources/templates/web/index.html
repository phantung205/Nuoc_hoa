<!DOCTYPE html>
<!-- Gọi base layout và truyền tham số -->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{web/layout/base :: main-layout(~{::title}, ~{::section})}">
<head>
    <!-- Trở thành tham số 'title' trong base.html -->
    <title>Nước Hoa Store - Trang Chủ</title>
</head>
<body>

<!-- Toàn bộ thẻ <section> này sẽ trở thành tham số 'content' và nhúng vào thẻ <main> trong base.html -->
<section>
    <div class="container">
        <div class="welcome-card">
            <h1>Chào mừng đến với Cửa Hàng Nước Hoa</h1>

            <div sec:authorize="isAnonymous()">
                <p>Vui lòng đăng nhập hoặc đăng ký tài khoản để bắt đầu trải nghiệm mua sắm!</p>
            </div>

            <div sec:authorize="isAuthenticated()">
                <p>Bạn đã đăng nhập thành công vào hệ thống!</p>
                <p>Session của bạn đang hoạt động bình thường.</p>
            </div>
        </div>
    </div>
</section>

</body>
</html>
