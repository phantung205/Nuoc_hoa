<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Nước Hoa Store - Trang Chủ</title>
    <link rel="stylesheet" th:href="@{/web/css/index.css}">
    <link rel="stylesheet" th:href="@{/web/css/fragments/chat.css}">
</head>
<body>

<header>
    <a th:href="@{/}" class="logo">🌸 Nước Hoa Shop</a>
    <nav>
        <a th:href="@{/}">Trang chủ</a>
        <a th:href="@{/products}">Cửa hàng</a>

        <span sec:authorize="isAnonymous()">
        <a th:href="@{/auth/login}">Đăng nhập</a>
        <a th:href="@{/auth/register}">Đăng ký</a>
    </span>

        <span sec:authorize="isAuthenticated()" style="display: inline-flex; align-items: center;">
        <span style="color: #ffeb3b; margin-right: 15px;">
            Xin chào, <strong sec:authentication="name"></strong>
            (<span sec:authentication="principal.authorities"></span>)
        </span>

        <a th:href="@{/profile}" style="color: #00bcd4; font-weight: bold; margin-right: 15px; text-decoration: none;">[Trang Cá Nhân]</a>

        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" style="color: #00e676; font-weight: bold;">[Trang Quản Trị]</a>

        <form th:action="@{/auth/logout}" method="post" style="display: inline;">
            <button type="submit" class="btn-logout">Đăng xuất</button>
        </form>
    </span>
    </nav>
</header>

<div class="container">
    <div class="welcome-card">
        <h1>Chào mừng đến với Cửa Hàng Nước Hoa</h1>

        <div sec:authorize="isAnonymous()">
            <p>Vui lòng đăng nhập hoặc đăng ký tài khoản để bắt đầu trải nghiệm mua sắm!</p>
        </div>

        <div sec:authorize="isAuthenticated()">
            <p style="color: green; font-weight: bold;">Bạn đã đăng nhập thành công vào hệ thống!</p>
            <p>Session của bạn đang hoạt động bình thường.</p>
        </div>
    </div>
</div>
<div th:replace="~{web/fragments/chat-box :: chat-widget}"></div>
<script th:src="@{/web/js/fragments/chat.js}"></script>

</body>
</html>
