<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{web/layout/base :: main-layout(~{::title}, ~{}, ~{}, ~{::section})}">
<head>
    <title>Hồ Sơ Cá Nhân - 2T&C</title>
</head>
<body>

<section class="py-5 bg-light" style="min-height: 80vh;">
    <div class="container">
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                    <!-- Profile Header -->
                    <div class="bg-black text-light p-5 text-center position-relative">
                        <div class="position-absolute top-0 start-0 w-100 h-100" th:style="'background: url(' + @{/web/images/anh_slide1.jpg} + ') center/cover; opacity: 0.2;'"></div>
                        <div class="position-relative z-index-1">
                            <img th:src="${#strings.isEmpty(userProfile.avatarUrl)} ? @{/web/images/profilebase.png} : ${userProfile.avatarUrl}"
                                 alt="Avatar" class="rounded-circle border border-3 border-gold shadow mb-3" style="width: 120px; height: 120px; object-fit: cover;">
                            <h3 class="elegant-title gold-text mb-1" th:text="${userProfile.fullName != null && !userProfile.fullName.isEmpty() ? userProfile.fullName : user.username}">User Name</h3>
                            <p class="mb-0 text-light opacity-75" th:text="${user.email}">user@email.com</p>
                            <div class="mt-3">
                                <span class="badge bg-gold text-dark px-3 py-2 rounded-pill fw-bold">
                                    <i class="bi bi-star-fill me-1"></i> Điểm tích lũy: <span th:text="${userProfile.loyaltyPoints}">0</span> pt
                                </span>
                            </div>
                        </div>
                    </div>

                    <!-- Profile Form -->
                    <div class="card-body p-5">
                        <h4 class="fw-bold mb-4 border-bottom pb-3">Cập Nhật Thông Tin Cá Nhân</h4>

                        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                            <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <form th:action="@{/profile/update}" th:object="${profileRequest}" method="post" enctype="multipart/form-data">
                            
                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <label class="form-label text-muted fw-bold">Tên đăng nhập (Chỉ đọc)</label>
                                    <input type="text" class="form-control bg-light text-muted" th:value="${user.username}" readonly>
                                </div>
                                <div class="col-md-6 mt-3 mt-md-0">
                                    <label class="form-label text-muted fw-bold">Email liên hệ (Chỉ đọc)</label>
                                    <input type="email" class="form-control bg-light text-muted" th:value="${user.email}" readonly>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Họ và tên</label>
                                    <input type="text" class="form-control" th:field="*{fullName}" placeholder="Nhập họ và tên...">
                                </div>
                                <div class="col-md-6 mt-3 mt-md-0">
                                    <label class="form-label fw-bold">Số điện thoại</label>
                                    <input type="text" class="form-control" th:field="*{phone}" placeholder="Nhập số điện thoại...">
                                </div>
                            </div>

                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Giới tính</label>
                                    <select class="form-select" th:field="*{gender}">
                                        <option value="">-- Chọn giới tính --</option>
                                        <option value="NAM">Nam</option>
                                        <option value="NU">Nữ</option>
                                        <option value="KHAC">Khác</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mt-3 mt-md-0">
                                    <label class="form-label fw-bold">Ngày sinh</label>
                                    <input type="date" class="form-control" th:field="*{dateOfBirth}">
                                </div>
                            </div>

                            <div class="mb-4 p-4 border rounded bg-light">
                                <label class="form-label fw-bold"><i class="bi bi-image text-muted me-2"></i>Thay đổi ảnh đại diện</label>
                                <input class="form-control" type="file" name="avatarFile" accept="image/png, image/jpeg, image/jpg, image/webp">
                                <div class="form-text mt-2">Định dạng hỗ trợ: JPG, PNG, WEBP (Tối đa 2MB).</div>
                            </div>

                            <div class="text-end mt-5">
                                <button type="submit" class="btn btn-dark px-5 py-2 rounded-pill fw-bold">
                                    <i class="bi bi-check2-circle me-1"></i> Lưu Thay Đổi
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

</body>
</html>
