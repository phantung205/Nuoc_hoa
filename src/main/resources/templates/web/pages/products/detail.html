<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{web/layout/base :: main-layout(~{::title}, ~{::link},~{::script}, ~{::section})}">
<head>
    <title th:text="${product.name} + ' - Nước Hoa Store'">Chi Tiết Sản Phẩm</title>
    <link rel="stylesheet" th:href="@{/web/css/pages/products.css}">
</head>
<body>

<section class="product-detail-section py-5 bg-white">
    <div class="container mt-5 pt-3">
        
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/}" class="text-dark text-decoration-none">Trang Chủ</a></li>
                <li class="breadcrumb-item"><a th:href="@{/products}" class="text-dark text-decoration-none">Sản Phẩm</a></li>
                <li class="breadcrumb-item active" aria-current="page" th:text="${product.name}">Tên SP</li>
            </ol>
        </nav>

        <div class="row gx-5">
            <!-- Cột Trái: Ảnh Sản Phẩm -->
            <div class="col-md-6 mb-4">
                <div class="product-gallery">
                    <!-- Ảnh chính -->
                    <div class="main-image-container border rounded mb-3 overflow-hidden text-center bg-light p-3 shadow-sm">
                        <img id="mainImage" th:src="${product.mainImageUrl != null ? product.mainImageUrl : '/web/images/default-product.jpg'}" th:alt="${product.name}" class="img-fluid" style="max-height: 500px; object-fit: contain;">
                    </div>
                    
                    <!-- Thumbnails -->
                    <div class="d-flex gap-2 overflow-auto py-2" th:if="${product.imageUrls != null && product.imageUrls.size() > 1}">
                        <div th:each="imgUrl : ${product.imageUrls}" class="thumbnail-wrapper border rounded p-1 cursor-pointer" onclick="changeMainImage(this)">
                            <img th:src="${imgUrl}" class="img-fluid" style="width: 80px; height: 80px; object-fit: cover; cursor: pointer;">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Cột Phải: Thông tin Sản Phẩm -->
            <div class="col-md-6">
                <div class="product-info">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h1 class="fw-bold elegant-title mb-0" th:text="${product.name}">Tên Sản Phẩm</h1>
                        <span th:if="${product.discount != null && product.discount > 0}" class="badge bg-danger rounded-pill fs-6 px-3 py-2">- [[${#numbers.formatDecimal(product.discount, 0, 'COMMA', 0, 'POINT')}]] ₫</span>
                    </div>
                    
                    <p class="text-muted mb-4 fs-5" th:text="${product.brandName} + ' | ' + ${product.categoryName}">Thương Hiệu | Danh Mục</p>

                    <h2 class="price gold-text fw-bold mb-4" id="displayPrice" th:text="${#numbers.formatDecimal(product.minPrice, 0, 'COMMA', 0, 'POINT')} + ' ₫'">Giá</h2>

                    <div class="description-box mb-4 pb-4 border-bottom">
                        <h5 class="fw-bold mb-3">Mô Tả Sản Phẩm</h5>
                        <p class="text-muted lh-lg" th:text="${product.description}">Mô tả chi tiết...</p>
                    </div>

                    <!-- Lựa chọn biến thể -->
                    <form th:action="@{/cart/add}" method="post">
                        <input type="hidden" name="productId" th:value="${product.id}">
                        
                        <div class="mb-4" th:if="${product.variants != null && !product.variants.empty}">
                            <h5 class="fw-bold mb-3">Chọn Dung Tích & Nồng Độ:</h5>
                            <div class="d-flex flex-wrap gap-3">
                                <th:block th:each="v, stat : ${product.variants}">
                                    <input type="radio" class="btn-check variant-radio" name="variantId" th:id="'variant_' + ${v.id}" th:value="${v.id}" th:checked="${stat.index == 0}" th:data-price="${v.price}" th:data-stock="${v.stock}">
                                    <label class="btn btn-outline-dark px-4 py-2" th:for="'variant_' + ${v.id}">
                                        <span class="fw-bold d-block" th:text="${#numbers.formatDecimal(v.volume, 0, 'COMMA', 0, 'POINT')} + ' ml'">100 ml</span>
                                        <small class="text-muted" th:text="${v.concentration == 1 ? 'EDT' : (v.concentration == 2 ? 'EDP' : 'Parfum')}">EDP</small>
                                    </label>
                                </th:block>
                            </div>
                        </div>

                        <div class="d-flex align-items-center gap-3 mb-4">
                            <div class="input-group" style="width: 130px;">
                                <button class="btn btn-outline-secondary" type="button" onclick="updateQty(-1)">-</button>
                                <input type="number" class="form-control text-center bg-white" name="quantity" id="quantity" value="1" min="1" readonly>
                                <button class="btn btn-outline-secondary" type="button" onclick="updateQty(1)">+</button>
                            </div>
                            <span class="text-muted small">Trong kho: <span id="displayStock" th:text="${product.variants != null && !product.variants.empty ? product.variants[0].stock : 0}"></span></span>
                        </div>

                        <button type="submit" class="btn btn-gold btn-lg w-100 py-3 fw-bold fs-5 shadow-sm text-uppercase">
                            <i class="bi bi-cart-plus me-2"></i> Thêm Vào Giỏ Hàng
                        </button>
                    </form>
                    
                    <!-- Cam kết -->
                    <div class="mt-5 bg-light p-4 rounded text-center d-flex justify-content-around text-muted small">
                        <div><i class="bi bi-shield-check fs-3 d-block mb-2 text-dark"></i>Cam kết chính hãng</div>
                        <div><i class="bi bi-arrow-return-left fs-3 d-block mb-2 text-dark"></i>Đổi trả 7 ngày</div>
                        <div><i class="bi bi-truck fs-3 d-block mb-2 text-dark"></i>Giao hàng toàn quốc</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
    // Xử lý đổi ảnh main khi click thumbnail
    function changeMainImage(element) {
        const imgSrc = element.querySelector('img').src;
        document.getElementById('mainImage').src = imgSrc;
        
        // Highlight active thumbnail
        document.querySelectorAll('.thumbnail-wrapper').forEach(el => el.classList.remove('border-dark', 'border-2'));
        element.classList.add('border-dark', 'border-2');
    }

    // Xử lý cập nhật giá tiền và số lượng kho khi chọn variant
    document.querySelectorAll('.variant-radio').forEach(radio => {
        radio.addEventListener('change', function() {
            if(this.checked) {
                // Update price
                const price = parseFloat(this.getAttribute('data-price'));
                const formattedPrice = new Intl.NumberFormat('vi-VN').format(price) + ' ₫';
                document.getElementById('displayPrice').innerText = formattedPrice;

                // Update stock
                const stock = this.getAttribute('data-stock');
                document.getElementById('displayStock').innerText = stock;
            }
        });
    });

    // Hàm tăng giảm số lượng
    function updateQty(change) {
        const input = document.getElementById('quantity');
        let newVal = parseInt(input.value) + change;
        if (newVal >= 1) {
            input.value = newVal;
        }
    }
</script>

</body>
</html>
