<!DOCTYPE html>
<!-- Gọi layout admin, truyền title, chữ 'dashboard' để làm sáng menu, và nội dung thẻ div.admin-content -->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/base :: admin-layout(~{::title}, 'dashboard', ~{::div.admin-content},~{::link},~{})}">
<head>
    <title>Admin Dashboard - Nước Hoa Shop</title>
    <link rel="stylesheet" th:href="@{/admin/css/dashboard.css}">
</head>
<body>

<!-- Khối div này sẽ được nhúng thẳng vào bên trong <div class="main"> của base.html -->
<div class="admin-content">
    <div class="dashboard-header mb-4">
        <h2 class="fw-bold gold-accent">Tổng Quan Hệ Thống</h2>
        <p class="text-muted">Quản lý cửa hàng nước hoa cao cấp của bạn</p>
    </div>

    <div class="row g-4 mb-5">
        <div class="col-md-4">
            <div class="dashboard-card shadow-sm">
                <div class="card-icon">
                    <!-- Placeholder SVG for Users -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                </div>
                <div class="card-info">
                    <h3>TỔNG SỐ TÀI KHOẢN</h3>
                    <div class="number gold-text" th:text="${totalUsers}">0</div>
                </div>
                <div class="card-action mt-3">
                    <a th:href="@{/admin/users}" class="btn-link">Quản lý người dùng &rarr;</a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="dashboard-card shadow-sm">
                <div class="card-icon">
                    <!-- Placeholder SVG for Products -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                </div>
                <div class="card-info">
                    <h3>SẢN PHẨM</h3>
                    <div class="number gold-text">0</div>
                </div>
                <div class="card-action mt-3">
                    <a th:href="@{/admin/products}" class="btn-link">Quản lý sản phẩm &rarr;</a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="dashboard-card shadow-sm">
                <div class="card-icon">
                    <!-- Placeholder SVG for Orders -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                </div>
                <div class="card-info">
                    <h3>ĐƠN HÀNG</h3>
                    <div class="number gold-text">0</div>
                </div>
                <div class="card-action mt-3">
                    <a th:href="@{/admin/orders}" class="btn-link">Quản lý đơn hàng &rarr;</a>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Recent Activity Placeholder -->
    <div class="row">
        <div class="col-12">
            <div class="dashboard-card shadow-sm">
                <h4 class="mb-4">Hoạt Động Gần Đây</h4>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Khách Hàng</th>
                                <th>Hành Động</th>
                                <th>Thời Gian</th>
                                <th>Trạng Thái</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td colspan="4" class="text-center text-muted py-4">Chưa có dữ liệu</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
