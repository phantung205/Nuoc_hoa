<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/base :: admin-layout(~{::title}, 'banners', ~{::div.admin-content}, ~{::link}, ~{})}">
<head>
    <title>Quản Lý Banner - 2T&C Admin</title>
    <link rel="stylesheet" th:href="@{/admin/css/pages/banners/list.css}">
</head>
<body>

<div class="admin-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold gold-accent mb-1">Quản Lý Banner</h2>
            <p class="text-muted mb-0">Danh sách các banner hiển thị trên website</p>
        </div>
        <a href="/admin/banners/add" class="btn btn-dark"><i class="bi bi-plus-lg me-1"></i> Thêm Banner</a>
    </div>

    <!-- Alert Messages -->
    <div th:if="${param.success != null}" class="alert alert-success alert-dismissible fade show shadow-sm border-0" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:if="${param.success[0] == 'created'}">Tạo mới banner thành công!</span>
        <span th:if="${param.success[0] == 'updated'}">Cập nhật banner thành công!</span>
        <span th:if="${param.success[0] == 'deleted'}">Xóa banner thành công!</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm border-0" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="dashboard-card shadow-sm p-0 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th class="ps-4">ID</th>
                    <th>Hình Ảnh</th>
                    <th>Tiêu Đề</th>
                    <th>Liên Kết (Link)</th>
                    <th>Thứ Tự</th>
                    <th>Trạng Thái</th>
                    <th class="text-end pe-4">Hành Động</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="b : ${banners}">
                    <td class="ps-4 fw-bold text-muted" th:text="${'#' + b.id}">#1</td>
                    <td>
                        <img th:if="${b.imageUrl != null && !b.imageUrl.isEmpty()}" th:src="${b.imageUrl}" alt="Banner" class="img-thumbnail admin-banner-image-table">
                        <span th:unless="${b.imageUrl != null && !b.imageUrl.isEmpty()}" class="text-muted fst-italic">Không có</span>
                    </td>
                    <td class="fw-semibold" th:text="${b.title}">Tiêu Đề</td>
                    <td>
                        <a th:if="${b.link != null && !b.link.isEmpty()}" th:href="${b.link}" target="_blank" class="text-primary text-truncate d-inline-block" style="max-width: 150px;" th:title="${b.link}" th:text="${b.link}">Link</a>
                        <span th:unless="${b.link != null && !b.link.isEmpty()}" class="text-muted">Không có</span>
                    </td>
                    <td th:text="${b.sortOrder}">0</td>
                    <td>
                        <a th:href="@{/admin/banners/toggle/{id}(id=${b.id})}" class="text-decoration-none">
                            <span th:if="${b.status}" class="badge bg-success bg-opacity-75"><i class="bi bi-check-circle me-1"></i>Đang hiện</span>
                            <span th:unless="${b.status}" class="badge bg-secondary bg-opacity-75"><i class="bi bi-eye-slash-fill me-1"></i>Đang ẩn</span>
                        </a>
                    </td>
                    <td class="text-end pe-4">
                        <a th:href="@{/admin/banners/edit/{id}(id=${b.id})}" class="btn btn-sm btn-outline-primary rounded-pill px-3">
                            <i class="bi bi-pencil-square"></i>
                        </a>
                        <a th:href="@{/admin/banners/delete/{id}(id=${b.id})}"
                           class="btn btn-sm btn-outline-danger rounded-pill px-3"
                           onclick="return confirm('Bạn có chắc chắn muốn xóa banner này? Hành động này không thể hoàn tác.')">
                            <i class="bi bi-trash3"></i>
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(banners)}">
                    <td colspan="7" class="text-center py-5 text-muted">Không có dữ liệu banner.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
