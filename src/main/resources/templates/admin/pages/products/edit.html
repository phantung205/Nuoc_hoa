<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/base :: admin-layout(~{::title}, 'products', ~{::div.admin-content}, ~{::link}, ~{::script})}">
<head>
    <title>Cập Nhật Sản Phẩm - 2T&C Admin</title>
    <link rel="stylesheet" th:href="@{/admin/css/pages/products/edit.css}">
</head>
<body>

<div class="admin-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold gold-accent mb-1">Cập Nhật Sản Phẩm</h2>
            <p class="text-muted mb-0">Chỉnh sửa thông tin sản phẩm: <span th:text="${product.name}" class="fw-bold text-dark"></span></p>
        </div>
        <a href="/admin/products" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Quay lại</a>
    </div>

    <div class="dashboard-card shadow-sm mx-auto form-card-container">
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <form th:action="@{/admin/products/edit/{id}(id=${product.id})}" th:object="${product}" method="post" enctype="multipart/form-data">
            
            <h5 class="fw-bold mb-3 border-bottom pb-2">Thông Tin Chung</h5>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Tên Sản Phẩm <span class="text-danger">*</span></label>
                    <input type="text" class="form-control bg-light" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" th:field="*{name}" required>
                    <div class="invalid-feedback fw-semibold" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Giảm Giá (VNĐ)</label>
                    <input type="number" min="0" class="form-control bg-light" th:field="*{discount}">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Thương Hiệu <span class="text-danger">*</span></label>
                    <select class="form-select bg-light" th:classappend="${#fields.hasErrors('brandId')} ? 'is-invalid' : ''" th:field="*{brandId}" required>
                        <option value="">-- Chọn Thương Hiệu --</option>
                        <option th:each="b : ${brands}" th:value="${b.id}" th:text="${b.name}"></option>
                    </select>
                    <div class="invalid-feedback fw-semibold" th:if="${#fields.hasErrors('brandId')}" th:errors="*{brandId}"></div>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Danh Mục <span class="text-danger">*</span></label>
                    <select class="form-select bg-light" th:classappend="${#fields.hasErrors('categoryId')} ? 'is-invalid' : ''" th:field="*{categoryId}" required>
                        <option value="">-- Chọn Danh Mục --</option>
                        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                    </select>
                    <div class="invalid-feedback fw-semibold" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Mô Tả Sản Phẩm</label>
                <textarea class="form-control bg-light" th:field="*{description}" rows="3"></textarea>
            </div>

            <div class="mb-4">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="productActive" th:field="*{isActive}">
                    <label class="form-check-label fw-bold" for="productActive">Kích hoạt (Hiển thị)</label>
                </div>
            </div>

            <!-- PHẦN BIẾN THỂ (VARIANTS) -->
            <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2 mt-5">
                <h5 class="fw-bold mb-0">Các Lựa Chọn (Biến Thể)</h5>
                <button type="button" class="btn btn-sm btn-outline-dark" onclick="addVariant()">
                    <i class="bi bi-plus-circle me-1"></i> Thêm Lựa Chọn
                </button>
            </div>

            <div id="variants-container">
                <div class="variant-item border rounded p-3 mb-3 bg-light position-relative" th:each="v, stat : *{variants}">
                    
                    <input type="hidden" th:name="'variants[' + ${stat.index} + '].id'" th:value="${v.id}"><button type="button" class="btn btn-sm btn-danger position-absolute top-0 end-0 m-2" onclick="removeVariant(this)" th:if="${stat.index > 0}">
                        <i class="bi bi-trash"></i>
                    </button>
                    
                    <div class="row">
                        <div class="col-md-4 mb-2">
                            <label class="form-label fw-bold variant-label">Mã SKU</label>
                            <input type="text" class="form-control form-control-sm" th:name="'variants[' + ${stat.index} + '].sku'" th:value="${v.sku}">
                        </div>
                        <div class="col-md-4 mb-2">
                            <label class="form-label fw-bold variant-label">Dung tích (ml) <span class="text-danger">*</span></label>
                            <input type="number" step="0.1" min="0" class="form-control form-control-sm" th:name="'variants[' + ${stat.index} + '].volume'" th:value="${v.volume}" required>
                        </div>
                        <div class="col-md-4 mb-2">
                            <label class="form-label fw-bold variant-label">Nồng Độ</label>
                            <select class="form-select form-select-sm" th:name="'variants[' + ${stat.index} + '].concentration'">
                                <option value="1" th:selected="${v.concentration != null && v.concentration.intValue() == 1}">EDT</option>
                                <option value="2" th:selected="${v.concentration != null && v.concentration.intValue() == 2}">EDP</option>
                                <option value="3" th:selected="${v.concentration != null && v.concentration.intValue() == 3}">Parfum</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-2">
                            <label class="form-label fw-bold variant-label">Giá Bán (VNĐ) <span class="text-danger">*</span></label>
                            <input type="number" min="0" class="form-control form-control-sm" th:name="'variants[' + ${stat.index} + '].price'" th:value="${v.price}" required>
                        </div>
                        <div class="col-md-6 mb-2">
                            <label class="form-label fw-bold variant-label">Tồn Kho</label>
                            <input type="number" min="0" class="form-control form-control-sm" th:name="'variants[' + ${stat.index} + '].stock'" th:value="${v.stock}">
                        </div>
                    </div>
                </div>
            </div>

            <!-- PHẦN ẢNH SẢN PHẨM -->
            <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2 mt-5">
                <h5 class="fw-bold mb-0">Ảnh Sản Phẩm</h5>
            </div>
            
            <div class="alert alert-info py-2 alert-sm-text">
                <i class="bi bi-info-circle-fill me-1"></i> Ảnh nào được tích chọn sẽ là ảnh đại diện. Bạn có thể chọn thêm nhiều ảnh mới cùng lúc.
            </div>

            <div id="images-container">
                <div class="border rounded p-3 mb-3 bg-light">
                    <div class="row mb-3">
                        <div class="col-md-12">
                            <label class="form-label fw-bold variant-label">Chọn thêm file ảnh mới (Tùy chọn)</label>
                            <input type="file" id="fileInput" class="form-control form-control-sm" name="imageFiles" accept="image/*" multiple>
                            <small class="text-muted">Giữ Ctrl hoặc Shift để chọn nhiều ảnh cùng lúc.</small>
                        </div>
                    </div>
                    
                    <hr>
                    <label class="form-label fw-bold text-primary"><i class="bi bi-images me-1"></i>Danh sách ảnh của sản phẩm:</label>
                    <div id="preview-container" class="d-flex flex-wrap gap-3 mt-2">
                        <!-- Danh sách ảnh cũ -->
                        <div th:each="imgUrl, iStat : ${product.existingImageUrls}" class="preview-item position-relative border rounded p-2 text-center bg-white shadow-sm" style="width: 120px;" data-type="existing">
                            <img th:src="${imgUrl}" alt="Ảnh cũ" style="height: 80px; width: 100px; object-fit: cover; border-radius: 4px;">
                            <input type="hidden" name="existingImageUrls" th:value="${imgUrl}">
                            <button type="button" class="btn btn-sm btn-danger position-absolute top-0 end-0 m-1 p-0" style="width: 22px; height: 22px; line-height: 1; border-radius: 50%;" onclick="removeExistingImage(this)">
                                <i class="bi bi-x"></i>
                            </button>
                            <div class="mt-2 form-check d-flex justify-content-center">
                                <input type="radio" name="primaryImageIndex" th:value="${iStat.index}" th:checked="${iStat.index == product.primaryImageIndex}" class="form-check-input primary-radio me-1" th:id="'old_radio_' + ${iStat.index}" onchange="updateRadioIndices()">
                                <label class="form-check-label small text-success fw-bold" th:for="'old_radio_' + ${iStat.index}">Ảnh chính</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <hr class="mb-4">
            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <a href="/admin/products" class="btn btn-light px-4">Hủy Bỏ</a>
                <button type="submit" class="btn btn-gold-admin px-4"><i class="bi bi-check2-circle me-1"></i> Lưu Thay Đổi</button>
            </div>
        </form>
    </div>
</div>

<script>
    let variantIndex = document.querySelectorAll('.variant-item').length;

    function addVariant() {
        const container = document.getElementById('variants-container');
        
        const html = `
            <div class="variant-item border rounded p-3 mb-3 bg-light position-relative">
                <button type="button" class="btn btn-sm btn-danger position-absolute top-0 end-0 m-2" onclick="removeVariant(this)">
                    <i class="bi bi-trash"></i>
                </button>
                
                <div class="row">
                    <div class="col-md-4 mb-2">
                        <label class="form-label fw-bold variant-label">Mã SKU</label>
                        <input type="text" class="form-control form-control-sm" name="variants[${variantIndex}].sku">
                    </div>
                    <div class="col-md-4 mb-2">
                        <label class="form-label fw-bold variant-label">Dung tích (ml) <span class="text-danger">*</span></label>
                        <input type="number" step="0.1" min="0" class="form-control form-control-sm" name="variants[${variantIndex}].volume" required>
                    </div>
                    <div class="col-md-4 mb-2">
                        <label class="form-label fw-bold variant-label">Nồng Độ</label>
                        <select class="form-select form-select-sm" name="variants[${variantIndex}].concentration">
                            <option value="1">EDT</option>
                            <option value="2" selected>EDP</option>
                            <option value="3">Parfum</option>
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-2">
                        <label class="form-label fw-bold variant-label">Giá Bán (VNĐ) <span class="text-danger">*</span></label>
                        <input type="number" min="0" class="form-control form-control-sm" name="variants[${variantIndex}].price" required>
                    </div>
                    <div class="col-md-6 mb-2">
                        <label class="form-label fw-bold variant-label">Tồn Kho</label>
                        <input type="number" min="0" class="form-control form-control-sm" name="variants[${variantIndex}].stock" value="10">
                    </div>
                </div>
            </div>
        `;
        
        container.insertAdjacentHTML('beforeend', html);
        variantIndex++;
    }

    function removeVariant(btn) {
        btn.closest('.variant-item').remove();
        
        // Re-index all variants to avoid gaps that cause Spring MVC to insert null elements
        const items = document.querySelectorAll('.variant-item');
        items.forEach((item, index) => {
            const inputs = item.querySelectorAll('input, select');
            inputs.forEach(input => {
                if (input.name && input.name.startsWith('variants[')) {
                    input.name = input.name.replace(/variants\[\d+\]/, `variants[${index}]`);
                }
            });
        });
        
        // Update the global variantIndex for the next addition
        variantIndex = items.length;
    }

    // Call once on load
    document.addEventListener("DOMContentLoaded", function() {
        // Init variant logic if needed
        updateRadioIndices();
    });

    const fileInput = document.getElementById('fileInput');
    const previewContainer = document.getElementById('preview-container');
    let selectedFiles = [];

    fileInput.addEventListener('change', function(e) {
        const files = Array.from(e.target.files);
        selectedFiles = selectedFiles.concat(files);
        updateFileInput();
        renderNewFilePreviews();
        updateRadioIndices();
    });

    function updateFileInput() {
        const dt = new DataTransfer();
        selectedFiles.forEach(file => dt.items.add(file));
        fileInput.files = dt.files;
    }

    function removeNewFile(index) {
        selectedFiles.splice(index, 1);
        updateFileInput();
        renderNewFilePreviews();
        updateRadioIndices();
    }

    function removeExistingImage(btn) {
        btn.closest('.preview-item').remove();
        updateRadioIndices();
    }

    function renderNewFilePreviews() {
        // Clear dynamically added new previews
        document.querySelectorAll('.preview-item[data-type="new"]').forEach(el => el.remove());
        
        selectedFiles.forEach((file, index) => {
            const reader = new FileReader();
            reader.onload = function(e) {
                const html = `
                    <div class="preview-item position-relative border rounded p-2 text-center bg-white shadow-sm" style="width: 120px;" data-type="new" data-index="${index}">
                        <img src="${e.target.result}" style="height: 80px; width: 100px; object-fit: cover; border-radius: 4px;">
                        <button type="button" class="btn btn-sm btn-danger position-absolute top-0 end-0 m-1 p-0" style="width: 22px; height: 22px; line-height: 1; border-radius: 50%;" onclick="removeNewFile(${index})">
                            <i class="bi bi-x"></i>
                        </button>
                        <div class="mt-2 form-check d-flex justify-content-center">
                            <input type="radio" name="primaryImageIndex" class="form-check-input primary-radio me-1" id="new_radio_${index}" onchange="updateRadioIndices()">
                            <label class="form-check-label small text-success fw-bold" for="new_radio_${index}">Ảnh chính</label>
                        </div>
                    </div>
                `;
                previewContainer.insertAdjacentHTML('beforeend', html);
                updateRadioIndices();
            }
            reader.readAsDataURL(file);
        });
    }

    function updateRadioIndices() {
        const items = document.querySelectorAll('.preview-item');
        let hasChecked = false;
        items.forEach((item, index) => {
            const radio = item.querySelector('.primary-radio');
            if (radio) {
                radio.value = index;
                if (radio.checked) hasChecked = true;
            }
        });
        
        // Ensure at least the first one is checked if none is checked
        if (!hasChecked && items.length > 0) {
            const firstRadio = items[0].querySelector('.primary-radio');
            if(firstRadio) firstRadio.checked = true;
        }
    }
</script>
</body>
</html>
