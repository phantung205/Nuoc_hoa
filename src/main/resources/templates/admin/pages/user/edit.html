<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cập Nhật Tài Khoản</title>
    <link rel="stylesheet" th:href="@{/admin/css/user/edit.css}">
</head>
<body>

<div class="card">
    <h2>Cập Nhật Tài Khoản</h2>

    <div th:if="${errorMessage}" class="alert-error" th:text="${errorMessage}"></div>

    <form th:action="@{/admin/users/edit/{id}(id=${userRequest.id})}" th:object="${userRequest}" method="post">
        <div class="form-group">
            <label>Tên Đăng Nhập:</label>
            <input type="text" th:field="*{username}" readonly style="background-color: #e5e7eb;">
        </div>

        <div class="form-group">
            <label>Email:</label>
            <input type="email" th:field="*{email}" required>
        </div>

        <div class="form-group">
            <label>Mật Khẩu Mới:</label>
            <input type="password" th:field="*{password}">
            <span class="note">* Để trống nếu không muốn thay đổi mật khẩu</span>
        </div>

        <div class="form-group">
            <label>Quyền Mạng:</label>
            <select th:field="*{role}">
                <option value="USER">USER</option>
                <option value="ADMIN">ADMIN</option>
            </select>
        </div>

        <div class="form-group">
            <label>Trạng Thái:</label>
            <select th:field="*{status}">
                <option value="ACTIVE">HOẠT ĐỘNG</option>
                <option value="LOCKED">KHÓA</option>
                <option value="UNVERIFIED">CHỜ XÁC THỰC</option>
            </select>
        </div>

        <button type="submit" class="btn">Lưu Thay Đổi</button>
        <a href="/admin/users" style="display:block; text-align:center; margin-top:15px; text-decoration:none; color:#6b7280;">Hủy bỏ</a>
    </form>
</div>

</body>
</html>
