<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Tài Khoản</title>
    <link rel="stylesheet" th:href="@{/admin/css/user/list.css}">
</head>
<body>

<div class="container">
    <a href="/admin/dashboard" class="btn btn-back">&larr; Quay lại Dashboard</a>

    <div class="header">
        <h2>Danh Sách Người Dùng</h2>
        <a href="/admin/users/add" class="btn btn-add">+ Thêm Tài Khoản</a>
    </div>

    <div th:if="${param.success != null}" class="alert alert-success">
        <span th:if="${param.success[0] == 'created'}">Tạo mới tài khoản thành công!</span>
        <span th:if="${param.success[0] == 'updated'}">Cập nhật tài khoản thành công!</span>
        <span th:if="${param.success[0] == 'deleted'}">Xóa tài khoản thành công!</span>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Tên Đăng Nhập</th>
            <th>Email</th>
            <th>Quyền</th>
            <th>Trạng Thái</th>
            <th>Hành Động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${users}">
            <td th:text="${u.id}">1</td>
            <td th:text="${u.username}">username</td>
            <td th:text="${u.email}">email@gmail.com</td>
            <td th:text="${u.role != null ? u.role.name : 'N/A'}">USER</td>
            <td>
                <span th:if="${u.status == 'ACTIVE'}" class="badge badge-active">HOẠT ĐỘNG</span>
                <span th:if="${u.status == 'LOCKED'}" class="badge badge-locked">ĐÃ KHÓA</span>
                <span th:if="${u.status == 'UNVERIFIED'}" class="badge badge-unverified">CHỜ XÁC THỰC</span>
            </td>
            <td>
                <a th:href="@{/admin/users/edit/{id}(id=${u.id})}" class="btn btn-edit">Sửa</a>
                <form th:action="@{/admin/users/delete/{id}(id=${u.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-delete" onclick="return confirm('Bạn có chắc chắn muốn xóa tài khoản này?')">Xóa</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
