<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/base :: admin-layout(~{::title}, 'users', ~{::div.admin-content}, ~{::link}, ~{})}">
<head>
    <title>Thêm Tài Khoản Mới - 2T&C Admin</title>
    <link rel="stylesheet" th:href="@{/admin/css/pages/user/add.css}">
</head>
<body>

<div class="admin-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold gold-accent mb-1">Thêm Mới Người Dùng</h2>
            <p class="text-muted mb-0">Tạo tài khoản mới cho hệ thống</p>
        </div>
        <a href="/admin/users" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Quay lại</a>
    </div>

    <div class="dashboard-card shadow-sm mx-auto" style="max-width: 600px;">
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <form th:action="@{/admin/users/add}" th:object="${userRequest}" method="post">
            <div class="mb-3">
                <label class="form-label fw-bold">Tên Đăng Nhập <span class="text-danger">*</span></label>
                <input type="text" class="form-control bg-light" th:field="*{username}" required placeholder="Nhập tên đăng nhập...">
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Địa Chỉ Email <span class="text-danger">*</span></label>
                <input type="email" class="form-control bg-light" th:field="*{email}" required placeholder="example@email.com">
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Mật Khẩu <span class="text-danger">*</span></label>
                <input type="password" class="form-control bg-light" th:field="*{password}" required placeholder="Nhập mật khẩu an toàn...">
            </div>

            <div class="row mb-4">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Vai Trò</label>
                    <select class="form-select bg-light" th:field="*{role}">
                        <option value="USER">Khách Hàng (USER)</option>
                        <option value="ADMIN">Quản Trị Viên (ADMIN)</option>
                    </select>
                </div>
                <div class="col-md-6 mt-3 mt-md-0">
                    <label class="form-label fw-bold">Trạng Thái</label>
                    <select class="form-select bg-light" th:field="*{status}">
                        <option value="ACTIVE">Hoạt Động</option>
                        <option value="UNVERIFIED">Chờ Xác Thực</option>
                        <option value="LOCKED">Đã Khóa</option>
                    </select>
                </div>
            </div>

            <hr class="mb-4">
            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <a href="/admin/users" class="btn btn-light px-4">Hủy Bỏ</a>
                <button type="submit" class="btn btn-dark px-4"><i class="bi bi-save me-1"></i> Tạo Tài Khoản</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
