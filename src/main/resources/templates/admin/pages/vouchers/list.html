<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/base :: admin-layout(~{::title}, 'vouchers', ~{::div.admin-content}, ~{}, ~{})}">
<head>
    <title>Quản Lý Mã Giảm Giá - 2T&C Admin</title>
</head>
<body>

<div class="admin-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold gold-accent mb-1">Quản Lý Mã Giảm Giá</h2>
            <p class="text-muted mb-0">
                Danh sách mã khuyến mãi (Voucher)
                <span class="badge bg-gold text-dark ms-2 fw-medium" th:text="'Tổng cộng: ' + ${#lists.size(vouchers)} + ' voucher'">Tổng cộng: 0 voucher</span>
            </p>
        </div>
        <a href="/admin/vouchers/add" class="btn btn-dark"><i class="bi bi-plus-lg me-1"></i> Thêm Mã Mới</a>
    </div>

    <!-- Alert Messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm border-0" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm border-0" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="dashboard-card shadow-sm p-0 overflow-hidden bg-white rounded">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0 datatable">
                <thead class="table-dark">
                <tr>
                    <th class="ps-4">Mã Code</th>
                    <th>Loại</th>
                    <th>Giá trị</th>
                    <th>Thời hạn</th>
                    <th>Đã dùng</th>
                    <th>Trạng Thái</th>
                    <th class="text-end pe-4">Hành Động</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="v : ${vouchers}">
                    <td class="ps-4 fw-bold text-primary" th:text="${v.code}">CODE</td>
                    <td>
                        <span th:if="${v.discountType == 'PERCENT'}" class="badge bg-info text-dark">Phần trăm (%)</span>
                        <span th:if="${v.discountType == 'FIXED'}" class="badge bg-secondary">Tiền cố định</span>
                    </td>
                    <td class="fw-semibold">
                        <span th:if="${v.discountType == 'PERCENT'}" th:text="${v.discountValue} + '%'"></span>
                        <span th:if="${v.discountType == 'FIXED'}" th:text="${#numbers.formatDecimal(v.discountValue, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                    </td>
                    <td>
                        <small class="text-muted d-block" th:if="${v.startDate != null}">Từ: <span th:text="${#temporals.format(v.startDate, 'dd/MM/yyyy')}"></span></small>
                        <small class="text-muted d-block" th:if="${v.endDate != null}">Đến: <span th:text="${#temporals.format(v.endDate, 'dd/MM/yyyy')}"></span></small>
                        <small class="text-muted d-block" th:if="${v.startDate == null and v.endDate == null}">Không giới hạn</small>
                    </td>
                    <td>
                        <span th:text="${v.usageCount}"></span> / <span th:text="${v.usageLimit != null ? v.usageLimit : '∞'}"></span>
                    </td>
                    <td>
                        <span th:if="${v.isActive}" class="badge bg-success bg-opacity-75"><i class="bi bi-check-circle me-1"></i>Hoạt động</span>
                        <span th:unless="${v.isActive}" class="badge bg-danger bg-opacity-75"><i class="bi bi-x-circle me-1"></i>Đã khóa</span>
                    </td>
                    <td class="text-end pe-4">
                        <a th:href="@{/admin/vouchers/edit/{id}(id=${v.id})}" class="btn btn-sm btn-outline-primary rounded-pill px-3">
                            <i class="bi bi-pencil-square"></i> Sửa
                        </a>
                        <a th:href="@{/admin/vouchers/delete/{id}(id=${v.id})}"
                           class="btn btn-sm btn-outline-danger rounded-pill px-3 ms-1"
                           onclick="return confirm('Bạn có chắc chắn muốn xóa mã giảm giá này không?');">
                            <i class="bi bi-trash3"></i> Xóa
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(vouchers)}">
                    <td colspan="7" class="text-center py-5 text-muted">Không có dữ liệu mã giảm giá nào.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
