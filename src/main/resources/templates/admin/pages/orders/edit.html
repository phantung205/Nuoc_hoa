<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/base :: admin-layout(~{::title}, 'orders', ~{::section}, ~{}, ~{})}">
<head>
    <title>Chi Tiết Đơn Hàng - Admin</title>
</head>
<body>

<section class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <a th:href="@{/admin/orders}" class="btn btn-outline-secondary btn-sm mb-2">
                <i class="bi bi-arrow-left"></i> Quay Lại
            </a>
            <h2 class="fw-bold mb-0 text-dark">Chi Tiết Đơn Hàng #<span th:text="${order.id}"></span></h2>
        </div>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="row">
        <!-- Cột trái: Thông tin sản phẩm & Khách hàng -->
        <div class="col-lg-8 mb-4">
            <!-- Sản phẩm -->
            <div class="card border-0 shadow-sm rounded-4 mb-4">
                <div class="card-body p-4">
                    <h5 class="fw-bold mb-4 border-bottom pb-2">Sản Phẩm Đã Đặt</h5>
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Sản Phẩm</th>
                                    <th>Phân Loại</th>
                                    <th>Đơn Giá</th>
                                    <th>SL</th>
                                    <th class="text-end">Thành Tiền</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="detail : ${details}">
                                    <td class="fw-semibold text-dark" th:text="${detail.productVariant.product.name}">Tên SP</td>
                                    <td><span class="badge bg-light text-dark border" th:text="${detail.productVariant.volume} + 'ml'">100ml</span></td>
                                    <td th:text="${#numbers.formatDecimal(detail.unitPrice, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0</td>
                                    <td th:text="${detail.quantity}">1</td>
                                    <td class="text-end fw-bold gold-text" th:text="${#numbers.formatDecimal(detail.unitPrice * detail.quantity, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0</td>
                                </tr>
                            </tbody>
                            <tfoot class="table-group-divider">
                                <tr>
                                    <td colspan="4" class="text-end fw-bold">Tạm tính:</td>
                                    <td class="text-end fw-semibold" th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td>
                                </tr>
                                <tr>
                                    <td colspan="4" class="text-end fw-bold">Giảm giá:</td>
                                    <td class="text-end text-danger fw-semibold">
                                        -<span th:text="${#numbers.formatDecimal(order.discountAmount, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></span>
                                    </td>
                                </tr>
                                <tr>
                                    <td colspan="4" class="text-end fw-bold fs-5">TỔNG CỘNG:</td>
                                    <td class="text-end fw-bold text-success fs-5" th:text="${#numbers.formatDecimal(order.finalAmount, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Khách hàng -->
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4">
                    <h5 class="fw-bold mb-4 border-bottom pb-2">Thông Tin Giao Hàng</h5>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="text-muted small">Người Nhận</label>
                            <p class="fw-semibold mb-0" th:text="${order.shippingAddress != null ? order.shippingAddress.receiverName : order.user.username}">Nguyễn Văn A</p>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="text-muted small">Số Điện Thoại</label>
                            <p class="fw-semibold mb-0" th:text="${order.shippingAddress != null ? order.shippingAddress.phoneNumber : order.user.email}">0987654321</p>
                        </div>
                        <div class="col-12 mb-3">
                            <label class="text-muted small">Địa Chỉ</label>
                            <p class="fw-semibold mb-0" th:text="${order.shippingAddress != null ? order.shippingAddress.receiverAddress : 'N/A'}">Hà Nội</p>
                        </div>
                        <div class="col-12 mb-3">
                            <label class="text-muted small">Ghi Chú</label>
                            <p class="fw-semibold mb-0 text-danger" th:text="${order.note != null && !order.note.empty ? order.note : 'Không có'}">Giao giờ hành chính</p>
                        </div>
                        <div class="col-12">
                            <label class="text-muted small">Hình Thức Thanh Toán</label>
                            <p class="fw-semibold mb-0">
                                <span class="badge bg-secondary px-3 py-2" th:text="${order.payments}">COD</span>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Cột phải: Trạng thái & Hành động -->
        <div class="col-lg-4">
            <div class="card border-0 shadow-sm rounded-4 position-sticky" style="top: 20px;">
                <div class="card-body p-4">
                    <h5 class="fw-bold mb-4 border-bottom pb-2">Cập Nhật Trạng Thái</h5>
                    
                    <form th:action="@{/admin/orders/update/{id}(id=${order.id})}" method="post">
                        <div class="mb-4">
                            <label class="form-label text-muted small">Trạng thái hiện tại</label>
                            <select class="form-select form-select-lg fw-semibold" name="status" id="statusSelect">
                                <option value="PENDING" th:selected="${order.status == 'PENDING'}" class="text-primary">Chờ xử lý</option>
                                <option value="PROCESSING" th:selected="${order.status == 'PROCESSING'}" class="text-info">Đang xử lý</option>
                                <option value="SHIPPED" th:selected="${order.status == 'SHIPPED'}" class="text-warning">Đang giao hàng</option>
                                <option value="DELIVERED" th:selected="${order.status == 'DELIVERED'}" class="text-success">Thành công</option>
                                <option value="CANCELLED" th:selected="${order.status == 'CANCELLED'}" class="text-danger">Đã hủy</option>
                            </select>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-dark py-3 fw-bold">
                                <i class="bi bi-save me-2"></i> Lưu Trạng Thái
                            </button>
                        </div>
                    </form>
                    
                    <hr class="my-4">
                    
                    <form th:action="@{/admin/orders/delete/{id}(id=${order.id})}" method="post" onsubmit="return confirm('Xác nhận xóa VĨNH VIỄN đơn hàng này? Khuyến nghị nên chọn trạng thái ĐÃ HỦY thay vì xóa hẳn.');">
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-outline-danger py-2">
                                <i class="bi bi-trash"></i> Xóa vĩnh viễn đơn hàng
                            </button>
                        </div>
                    </form>
                    
                </div>
            </div>
        </div>
    </div>
</section>

</body>
</html>
