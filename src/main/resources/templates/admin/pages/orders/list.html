<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/base :: admin-layout(~{::title}, 'orders', ~{::section}, ~{}, ~{})}">
<head>
    <title>Quản Lý Đơn Hàng - Admin</title>
</head>
<body>

<section class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0 text-dark">Quản Lý Đơn Hàng</h2>
    </div>

    <!-- Alerts -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">Mã Đơn</th>
                            <th>Khách Hàng</th>
                            <th>Ngày Đặt</th>
                            <th>Tổng Tiền</th>
                            <th>Hình Thức</th>
                            <th>Trạng Thái</th>
                            <th class="text-end pe-4">Hành Động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="order : ${orders}">
                            <td class="ps-4 fw-bold">#<span th:text="${order.id}"></span></td>
                            <td>
                                <div class="fw-semibold text-dark" th:text="${order.shippingAddress != null ? order.shippingAddress.receiverName : order.user.username}"></div>
                                <small class="text-muted" th:text="${order.shippingAddress != null ? order.shippingAddress.phoneNumber : order.user.email}"></small>
                            </td>
                            <td th:text="${order.createdAt != null ? #temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm') : 'N/A'}"></td>
                            <td class="fw-bold text-success" th:text="${#numbers.formatDecimal(order.finalAmount, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td>
                            <td><span class="badge bg-secondary" th:text="${order.payments}"></span></td>
                            <td>
                                <span class="badge bg-primary" th:if="${order.status == 'PENDING'}">Chờ xử lý</span>
                                <span class="badge bg-success" th:if="${order.status == 'PAID'}">Đã thanh toán</span>
                                <span class="badge bg-info" th:if="${order.status == 'PROCESSING'}">Đang xử lý</span>
                                <span class="badge bg-warning text-dark" th:if="${order.status == 'SHIPPED'}">Đang giao</span>
                                <span class="badge bg-success" th:if="${order.status == 'DELIVERED'}">Thành công</span>
                                <span class="badge bg-danger" th:if="${order.status == 'CANCELLED'}">Đã hủy</span>
                            </td>
                            <td class="text-end pe-4">
                                <a th:href="@{/admin/orders/edit/{id}(id=${order.id})}" class="btn btn-sm btn-outline-primary me-2">
                                    <i class="bi bi-pencil-square"></i> Chi Tiết
                                </a>
                                <form th:action="@{/admin/orders/delete/{id}(id=${order.id})}" method="post" class="d-inline" onsubmit="return confirm('Bạn có chắc chắn muốn xóa đơn hàng này? Thao tác này không thể hoàn tác!');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">
                                        <i class="bi bi-trash"></i> Xóa
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${orders.empty}">
                            <td colspan="7" class="text-center py-5 text-muted">
                                <i class="bi bi-box-seam fs-1 d-block mb-3"></i>
                                Chưa có đơn hàng nào trong hệ thống.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>

</body>
</html>
