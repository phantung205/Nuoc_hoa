<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/base :: admin-layout(~{::title}, 'bands', ~{::div.admin-content}, ~{::link}, ~{})}">
<head>
    <title>Cập Nhật Thương Hiệu - 2T&C Admin</title>
    <link rel="stylesheet" th:href="@{/admin/css/pages/bands/edit.css}">
</head>
<body>

<div class="admin-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold gold-accent mb-1">Cập Nhật Thương Hiệu</h2>
            <p class="text-muted mb-0">Chỉnh sửa thông tin thương hiệu: <span th:text="${brand.name}" class="fw-bold text-dark"></span></p>
        </div>
        <a href="/admin/brands" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Quay lại</a>
    </div>

    <div class="dashboard-card shadow-sm mx-auto form-card-container">
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <form th:action="@{/admin/brands/edit/{id}(id=${brand.id})}" th:object="${brand}" method="post" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label fw-bold">Tên Thương Hiệu <span class="text-danger">*</span></label>
                <input type="text" class="form-control bg-light" th:field="*{name}" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Xuất Xứ</label>
                <input type="text" class="form-control bg-light" th:field="*{originCountry}">
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Ảnh Logo Hiện Tại</label>
                <div class="mb-2">
                    <img th:if="${brand.logo != null && !brand.logo.isEmpty()}" th:src="${brand.logo}" alt="Current Logo" class="img-thumbnail admin-brand-logo-preview">
                    <span th:unless="${brand.logo != null && !brand.logo.isEmpty()}" class="text-muted fst-italic">Không có ảnh</span>
                </div>
                <!-- Giữ lại URL logo cũ nếu không chọn file mới -->
                <input type="hidden" th:field="*{logo}">
                
                <label class="form-label fw-bold">Tải lên Ảnh Mới</label>
                <input type="file" class="form-control bg-light" name="logoFile" accept="image/*">
            </div>

            <div class="mb-4">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="brandActive" th:field="*{isActive}">
                    <label class="form-check-label fw-bold" for="brandActive">Kích hoạt (Hiển thị)</label>
                </div>
            </div>

            <hr class="mb-4">
            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <a href="/admin/brands" class="btn btn-light px-4">Hủy Bỏ</a>
                <button type="submit" class="btn btn-gold-admin px-4"><i class="bi bi-check2-circle me-1"></i> Lưu Thay Đổi</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
