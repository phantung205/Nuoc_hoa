<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:fragment="header" class="admin-header d-flex justify-content-between align-items-center px-4 py-3 bg-white">
    <div class="header-left">
        <!-- Có thể thêm breadcrumb hoặc toggle sidebar ở đây sau -->
    </div>
    <div class="header-right d-flex align-items-center gap-3">
        <div class="user-greeting text-dark fw-medium">
            Xin chào, <span class="gold-text fw-bold" th:text="${#authentication.name}">Admin</span>!
        </div>
        
        <div class="vr mx-2"></div>
        
        <a th:href="@{/}" class="btn btn-outline-dark btn-sm rounded-pill px-3 d-flex align-items-center" target="_blank" title="Xem Website">
            <i class="bi bi-box-arrow-up-right me-2"></i> Xem Website
        </a>
        
        <form th:action="@{/auth/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-danger btn-sm rounded-pill px-3 d-flex align-items-center" title="Đăng Xuất">
                <i class="bi bi-box-arrow-right me-2"></i> Đăng Xuất
            </button>
        </form>
    </div>
</div>
</body>
</html>
