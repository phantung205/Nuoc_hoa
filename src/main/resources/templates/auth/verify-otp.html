<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{web/layout/base :: main-layout(~{::title}, ~{}, ~{::script}, ~{::section})}">
<head>
    <title th:text="${isResetPassword} ? 'Xác thực OTP Quên Mật Khẩu - L\'AURÉAL' : 'Xác thực OTP Đăng Ký - L\'AURÉAL'">Xác thực OTP</title>
</head>
<body>

<section class="auth-section py-5 bg-light">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-body p-5 text-center">
                        <div class="mb-4">
                            <i class="bi bi-shield-lock gold-text display-1"></i>
                        </div>
                        <h2 class="elegant-title gold-text mb-3" th:text="${isResetPassword} ? 'Quên Mật Khẩu' : 'Xác Thực OTP'">Xác Thực OTP</h2>
                        <p class="text-muted mb-4">
                            Mã xác nhận gồm 6 chữ số đã được gửi đến email:<br>
                            <strong class="text-dark" th:text="${email}">user@example.com</strong>
                        </p>

                        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <span th:text="${errorMessage}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                            <span th:text="${successMessage}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <form th:action="${isResetPassword} ? @{/auth/verify-reset-otp} : @{/auth/verify-otp}" method="post">
                            <div class="form-floating mb-4">
                                <input type="text" name="otp" id="otp" class="form-control text-center fs-4 fw-bold otp-input-styled" maxlength="6" placeholder="000000" required autofocus autocomplete="off">
                                <label for="otp">Nhập mã OTP</label>
                            </div>

                            <div class="mb-4 text-muted">
                                <i class="bi bi-clock me-1"></i> Mã OTP sẽ hết hạn sau: <strong id="countdown" class="text-danger">02:00</strong>
                            </div>

                            <button type="submit" class="btn btn-gold w-100 py-3 mb-3 rounded-pill fw-bold" th:text="${isResetPassword} ? 'TIẾP TỤC ĐẶT LẠI MẬT KHẨU' : 'XÁC NHẬN ĐĂNG KÝ'">XÁC NHẬN</button>
                        </form>

                        <form th:action="${isResetPassword} ? @{/auth/resend-reset-otp} : @{/auth/resend-otp}" method="post">
                            <button type="submit" id="resendBtn" class="btn btn-link text-decoration-none text-muted p-0" disabled>
                                Chưa nhận được mã? <span class="gold-text fw-bold">Gửi lại</span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<script th:src="@{/auth/js/verify-otp.js}"></script>
</body>
</html>
