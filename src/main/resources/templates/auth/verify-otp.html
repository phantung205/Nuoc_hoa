<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isResetPassword} ? 'Xác thực OTP Quên Mật Khẩu' : 'Xác thực OTP Đăng Ký'">Xác thực OTP</title>
    <link rel="stylesheet" th:href="@{/auth/css/verify-otp.css}">
</head>
<body>

<header>
    <a th:href="@{/}" style="font-size: 20px;">🌸 Nước Hoa Shop</a>
    <a th:href="@{/auth/login}" style="font-size: 14px; font-weight: normal;">Đăng Nhập</a>
</header>

<div class="container">
    <h2 class="title" th:text="${isResetPassword} ? 'Xác Thực Quên Mật Khẩu' : 'Xác Thực Mã OTP'">Xác Thực Mã OTP</h2>
    <p class="subtitle">Mã xác nhận đã được gửi đến email:<br><strong th:text="${email}">user@example.com</strong></p>

    <div th:if="${errorMessage}" class="alert-error" th:text="${errorMessage}"></div>
    <div th:if="${successMessage}" class="alert-success" th:text="${successMessage}"></div>

    <form th:action="${isResetPassword} ? @{/auth/verify-reset-otp} : @{/auth/verify-otp}" method="post">
        <div class="form-group">
            <input type="text" name="otp" class="otp-input" maxlength="6" placeholder="000000" required autofocus autocomplete="off">
        </div>

        <div class="timer-box">
            Mã OTP sẽ hết hạn sau: <span id="countdown">02:00</span>
        </div>

        <button type="submit" class="btn-submit" th:text="${isResetPassword} ? 'Tiếp Tục Đặt Lại Mật Khẩu' : 'Xác Nhận Đăng Ký'">Xác Nhận</button>
    </form>

    <div class="actions">
        <form th:action="${isResetPassword} ? @{/auth/resend-reset-otp} : @{/auth/resend-otp}" method="post" style="display: inline;">
            <button type="submit" id="resendBtn" class="btn-resend" disabled>Gửi lại mã OTP</button>
        </form>
    </div>
</div>

<script th:src="@{/auth/js/verify-otp.js}"></script>
</body>
</html>
