<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{web/layout/base :: main-layout(~{::title}, ~{}, ~{}, ~{::section})}">
<head>
    <title>Đặt lại mật khẩu - 2T&C</title>
</head>
<body>

<section class="auth-section py-5 bg-light">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h2 class="elegant-title gold-text mb-2">Đặt Mật Khẩu Mới</h2>
                            <p class="text-muted">Vui lòng nhập mật khẩu mới cho tài khoản của bạn</p>
                        </div>

                        <!-- Alerts -->
                        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <span th:text="${errorMessage}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <form th:action="@{/auth/reset-password}" method="post">
                            <div class="form-floating mb-3">
                                <input type="password" class="form-control" id="password" name="password" placeholder="Mật khẩu mới" required autocomplete="new-password">
                                <label for="password">Mật khẩu mới</label>
                            </div>

                            <div class="form-floating mb-4">
                                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Xác nhận mật khẩu mới" required autocomplete="new-password">
                                <label for="confirmPassword">Xác nhận mật khẩu mới</label>
                            </div>

                            <button type="submit" class="btn btn-dark w-100 py-3 mb-4 rounded-pill">CẬP NHẬT MẬT KHẨU</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

</body>
</html>
