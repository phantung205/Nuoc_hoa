<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đặt lại mật khẩu</title>
    <link rel="stylesheet" th:href="@{/auth/css/reset-password.css}">
</head>
<body>
<div class="card">
    <h2 class="text-center">Đặt Mật Khẩu Mới</h2>
    <div th:if="${errorMessage}" class="error" th:text="${errorMessage}"></div>
    <form th:action="@{/auth/reset-password}" method="post">
        <div class="form-group">
            <label>Mật khẩu mới:</label>
            <input type="password" name="password" required>
        </div>
        <div class="form-group">
            <label>Xác nhận mật khẩu mới:</label>
            <input type="password" name="confirmPassword" required>
        </div>
        <button type="submit">Cập nhật mật khẩu</button>
    </form>
</div>
</body>
</html>
