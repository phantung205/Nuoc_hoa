<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quên mật khẩu</title>
    <!-- Nhúng file CSS từ static/auth/css/ -->
    <link rel="stylesheet" th:href="@{/auth/css/forgot-password.css}">
</head>
<body>
<div class="card">
    <h2 class="text-center">Quên Mật Khẩu</h2>
    <div th:if="${errorMessage}" class="error" th:text="${errorMessage}"></div>
    <form th:action="@{/auth/forgot-password}" method="post">
        <div class="form-group">
            <label>Nhập Tên đăng nhập hoặc Email:</label>
            <input type="text" name="identifier" required>
        </div>
        <button type="submit">Gửi mã OTP</button>
    </form>
    <p class="text-center">
        <a th:href="@{/auth/login}">Quay lại đăng nhập</a>
    </p>
</div>

<!-- Nhúng file JS từ static/auth/js/ (nếu có) -->
<script th:src="@{/auth/js/forgot-password.js}"></script>
</body>
</html>
