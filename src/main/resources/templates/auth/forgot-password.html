<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{web/layout/base :: main-layout(~{::title}, ~{}, ~{::script}, ~{::section})}">
<head>
    <title>Quên mật khẩu - 2T&C</title>
</head>
<body>

<section class="auth-section py-5 bg-light">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h2 class="elegant-title gold-text mb-2">Quên Mật Khẩu</h2>
                            <p class="text-muted">Nhập Tên đăng nhập hoặc Email để nhận mã OTP khôi phục</p>
                        </div>

                        <!-- Alerts -->
                        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <span th:text="${errorMessage}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <form th:action="@{/auth/forgot-password}" method="post">
                            <div class="form-floating mb-4">
                                <input type="text" class="form-control" id="identifier" name="identifier" placeholder="Tên đăng nhập hoặc Email" required autocomplete="off">
                                <label for="identifier">Tên đăng nhập hoặc Email</label>
                            </div>

                            <button type="submit" class="btn btn-dark w-100 py-3 mb-4 rounded-pill">GỬI MÃ OTP</button>

                            <div class="text-center text-muted">
                                <a th:href="@{/auth/login}" class="text-decoration-none gold-text fw-bold">
                                    <i class="bi bi-arrow-left me-1"></i>Quay lại đăng nhập
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Nhúng file JS từ static/auth/js/ (nếu có) -->
<script th:src="@{/auth/js/forgot-password.js}"></script>
</body>
</html>
