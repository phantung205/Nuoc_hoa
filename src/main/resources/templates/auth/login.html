<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{web/layout/base :: main-layout(~{::title}, ~{}, ~{}, ~{::section})}">
<head>
    <title>Đăng nhập - L'AURÉAL</title>
</head>
<body>

<section class="auth-section py-5 bg-light" style="min-height: 80vh; display: flex; align-items: center;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h2 class="elegant-title gold-text mb-2">Đăng Nhập</h2>
                            <p class="text-muted">Chào mừng trở lại với thế giới hương thơm</p>
                        </div>

                        <!-- Alerts -->
                        <div th:if="${param.registered}" class="alert alert-success alert-dismissible fade show" role="alert">
                            Đăng ký thành công! Vui lòng đăng nhập.
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                        <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            Tên đăng nhập hoặc mật khẩu không chính xác!
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                        <div th:if="${param.resetSuccess}" class="alert alert-success alert-dismissible fade show" role="alert">
                            Đặt lại mật khẩu thành công! Vui lòng đăng nhập lại.
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                        <div th:if="${param.logout}" class="alert alert-info alert-dismissible fade show" role="alert">
                            Bạn đã đăng xuất khỏi hệ thống.
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <form th:action="@{/auth/login-process}" method="post">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="username" name="username" placeholder="Tên đăng nhập" required autocomplete="off">
                                <label for="username">Tên đăng nhập</label>
                            </div>

                            <div class="form-floating mb-4">
                                <input type="password" class="form-control" id="password" name="password" placeholder="Mật khẩu" required>
                                <label for="password">Mật khẩu</label>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="rememberMe" name="remember-me">
                                    <label class="form-check-label text-muted" for="rememberMe">
                                        Nhớ đăng nhập
                                    </label>
                                </div>
                                <a th:href="@{/auth/forgot-password}" class="text-decoration-none gold-text">Quên mật khẩu?</a>
                            </div>

                            <button type="submit" class="btn btn-dark w-100 py-3 mb-4 rounded-pill">ĐĂNG NHẬP</button>
                            
                            <div class="text-center text-muted">
                                Chưa có tài khoản? <a th:href="@{/auth/register}" class="text-decoration-none gold-text fw-bold">Đăng ký ngay</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

</body>
</html>
