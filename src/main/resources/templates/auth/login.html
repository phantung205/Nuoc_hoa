<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - NuocHoa</title>
    <link rel="stylesheet" th:href="@{/auth/css/login.css}">
</head>
<body>

<div class="card">
    <h2 style="text-align: center;">Đăng Nhập</h2>

    <div th:if="${param.registered}" class="msg success">
        Đăng ký thành công! Vui lòng đăng nhập.
    </div>

    <div th:if="${param.error}" class="msg error">
        Tên đăng nhập hoặc mật khẩu không chính xác!
    </div>

    <div th:if="${param.resetSuccess}" class="msg success">
        Đặt lại mật khẩu thành công! Vui lòng đăng nhập lại.
    </div>

    <div th:if="${param.logout}" class="msg success">
        Bạn đã đăng xuất khỏi hệ thống.
    </div>

    <form th:action="@{/auth/login-process}" method="post">
        <div class="form-group">
            <label>Tên đăng nhập:</label>
            <input type="text" name="username" required autocomplete="off">
        </div>

        <div class="form-group">
            <label>Mật khẩu:</label>
            <input type="password" name="password" required>
        </div>

        <div class="form-group" >
            <input type="checkbox" id="rememberMe" name="remember-me" style="width: auto;">
            <label for="rememberMe">Nhớ đăng nhập</label>
        </div>

        <button type="submit">Đăng nhập</button>
    </form>

    <p style="text-align: center; margin-top: 15px;">
        <a th:href="@{/auth/forgot-password}">Quên mật khẩu?</a> |
        <a th:href="@{/auth/register}">Đăng ký ngay</a>
    </p>
</div>

</body>
</html>
