<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:fragment="header" class="admin-header d-flex justify-content-between align-items-center">
    <div class="header-left d-flex align-items-center gap-3">
        <div class="header-icon-box d-flex align-items-center justify-content-center shadow-sm">
            <i class="bi bi-droplet-half fs-5"></i>
        </div>
        <div class="d-none d-sm-block">
            <div class="header-welcome-title fw-bold">2T&C Perfume Staff</div>
            <div class="header-welcome-subtitle d-flex align-items-center gap-2">
                <span class="badge-status-dot"></span>
                <span>Khu vực tác nghiệp nhân viên</span>
            </div>
        </div>
    </div>

    <div class="header-right d-flex align-items-center gap-2 gap-md-3">
        <!-- Xem Website button -->
        <a th:href="@{/}" class="btn-header-action d-flex align-items-center gap-2 text-decoration-none" target="_blank" title="Xem Cửa Hàng Trực Tuyến">
            <i class="bi bi-globe2 text-secondary fs-6"></i>
            <span class="d-none d-md-inline">Xem Website</span>
        </a>

        <div class="header-divider d-none d-sm-block"></div>

        <!-- User profile pill -->
        <div class="header-user-profile" title="Tài khoản hiện tại">
            <div class="header-avatar" th:text="${#authentication.name != null and !#authentication.name.isEmpty() ? #strings.substring(#authentication.name, 0, 1) : 'S'}">S</div>
            <div class="user-info-text d-none d-md-block text-start">
                <div class="user-name fw-bold" th:text="${#authentication.name}">Staff</div>
                <div class="user-role-wrap">
                    <span sec:authorize="hasRole('ADMIN')" class="role-badge role-admin">Quản trị viên</span>
                    <span sec:authorize="hasRole('STAFF')" class="role-badge role-staff">Nhân viên</span>
                    <span sec:authorize="!hasRole('ADMIN') and !hasRole('STAFF')" class="role-badge role-user">Thành viên</span>
                </div>
            </div>
        </div>

        <div class="header-divider"></div>

        <!-- Đăng Xuất button -->
        <form th:action="@{/auth/logout}" method="post" class="m-0">
            <button type="submit" class="btn-header-logout d-flex align-items-center gap-2 border-0" title="Đăng Xuất Khỏi Hệ Thống">
                <i class="bi bi-box-arrow-right fs-6"></i>
                <span class="d-none d-sm-inline">Đăng Xuất</span>
            </button>
        </form>
    </div>
</div>
</body>
</html>
